name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paperlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paperlab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/paperlab
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run repository verification
        uses: ./.github/actions/verify
